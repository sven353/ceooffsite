[build]
  publish = "."
  command = ""

# This is a plain multi-page static site, not a single-page app.
# Do NOT add a catch-all rewrite here (e.g. from = "/*" to = "/index.html").
# That pattern is for SPAs and would break language routing by serving the
# root index.html for every path, including everything under /es/*.
# Netlify already serves /index.html and /es/index.html natively based on
# the publish directory (".") — no rewrite rule is needed for either.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/apply"
  to = "/#apply"
  status = 301

# English lives at the root ("/"), not at "/en" — there is no /en folder
# and there should never be one. These two rules only exist to catch
# anyone who guesses "/en" by hand (mirroring the "/es/" pattern) and send
# them to the real English page instead of a 404.
[[redirects]]
  from = "/en"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
  force = true

# Clean URLs for the legal pages (files are imprint.html / es/aviso-legal.html
# on disk, served without the .html extension).
[[redirects]]
  from = "/imprint"
  to = "/imprint.html"
  status = 200

[[redirects]]
  from = "/es/aviso-legal"
  to = "/es/aviso-legal.html"
  status = 200
